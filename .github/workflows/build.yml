name: Build Painel 7X

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Instalar .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Compilar executavel Windows x64
        run: >-
          dotnet publish Painel7X.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -o ./publish

      - name: Disponibilizar EXE para download
        uses: actions/upload-artifact@v4
        with:
          name: Painel7X-Windows-x64
          path: ./publish/Painel7X.exe
          if-no-files-found: error
          retention-days: 14
